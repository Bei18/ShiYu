```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>拾语 - 免费使用的视频聊天交友软件</title>

  <style>
    /* 
      这里放你原来的 CSS。
      你原来的 .app-name、.btn-download、
      .security-section、.visual-card 等样式
      都可以继续使用。
    */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;

      background: #fff;
      color: #222;
    }

    #app-content {
      width: 100%;
    }

    .app-name {
      text-align: center;
      margin: 30px 0 8px;
      font-size: 30px;
      font-weight: 700;
    }

    .app-desc {
      text-align: center;
      margin: 0 0 30px;
      font-size: 15px;
      color: #777;
    }

    .arrow-guide-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 20px auto;
    }

    .arrow-guide-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      width: calc(100% - 40px);
      max-width: 420px;

      margin: 20px auto;
      padding: 15px 20px;

      color: #fff;
      background: #222;
      border-radius: 10px;

      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-download svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .security-section {
      text-align: center;
      margin: 25px auto;
      padding: 0 20px;
    }

    .security-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: #555;
    }

    .tag-item svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .security-tips {
      margin: 12px 0 0;
      font-size: 12px;
      color: #999;
    }

    .wx-arrow-pointer {
      display: flex;
      justify-content: center;
      margin: 30px auto 10px;
    }

    .wx-arrow-pointer svg {
      width: 50px;
      height: 50px;
      fill: none;
      stroke: currentColor;
    }

    .visual-card {
      width: calc(100% - 40px);
      max-width: 420px;

      margin: 10px auto 30px;
      padding: 20px;

      border-radius: 14px;
      background: #f7f7f7;
    }

    .visual-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 18px;
      font-size: 15px;
      font-weight: 600;
    }

    .visual-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 20px;
      height: 20px;

      border-radius: 50%;
      background: #222;
      color: #fff;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }

    .step-num {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 28px;

      width: 28px;
      height: 28px;

      border-radius: 50%;
      background: #222;
      color: #fff;
    }

    .step-text {
      font-size: 14px;
      color: #333;
    }

    .mock-browser-icon {
      margin-left: auto;
    }

    .mock-browser-icon svg {
      width: 25px;
      height: 25px;
      fill: #555;
    }
  </style>
</head>

<body>

  <!-- app.js 会自动把你的 HTML 加载到这里 -->
  <div id="app-content"></div>


  <!-- GitHub Pages 上的 app.js -->
  <script src="https://bei18.github.io/shiyu/app.js"></script>

</body>
</html>
