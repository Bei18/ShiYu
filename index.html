<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拾语下载</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    /* 极简精致卡片 */
    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* 图标与阴影发光效果 */
    .app-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .app-icon-wrapper::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 0;
      background: rgba(56, 189, 248, 0.3);
      filter: blur(16px);
      border-radius: 20px;
      z-index: 1;
    }

    .app-icon {
      position: relative;
      z-index: 2;
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .app-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .app-desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* 主下载按钮 */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-download:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-download svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* 微信引导遮罩层 */
    .wx-mask {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
    }

    .wx-guide {
      position: absolute;
      top: 16px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* 跳动曲线箭头 */
    .wx-arrow {
      width: 56px;
      height: 56px;
      margin-right: 12px;
      animation: float 1.5s infinite ease-in-out;
    }

    .guide-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      max-width: 280px;
      margin-top: 4px;
    }

    .guide-title {
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .guide-step {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dots {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- 主卡片 -->
  <div class="card">
    <div class="app-icon-wrapper">
      <img src="https://sychat.cn/favicon.ico" alt="拾语 Logo" class="app-icon">
    </div>
    
    <h1 class="app-name">拾语</h1>
    <p class="app-desc">免费使用的视频聊天交友软件</p>

    <a href="https://oss01.sychat.cn/app/%E6%8B%BE%E8%AF%AD20260709145300_V1.0.8_1008.apk" class="btn-download" id="downloadBtn">
      <span id="btnText">下载</span>
    </a>
  </div>

  <!-- 微信专属提示遮罩 -->
  <div class="wx-mask" id="wxMask">
    <div class="wx-guide">
      <!-- 曲线箭头图案 -->
      <svg class="wx-arrow" viewBox="0 0 50 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 10 40 Q 30 20 42 8" />
        <path d="M 28 8 L 42 8 L 42 22" />
      </svg>
      
      <div class="guide-card">
        <div class="guide-title">请在浏览器中打开</div>
        <div class="guide-step">
          1. 点击右上角 <span class="badge-dots">•••</span> 按钮
        </div>
        <div class="guide-step">
          2. 选择 <strong>「在浏览器打开」</strong> 即可下载
        </div>
      </div>
    </div>
  </div>

  <script>
    function isWeChat() {
      return /micromessenger/i.test(navigator.userAgent);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (isWeChat()) {
        const mask = document.getElementById('wxMask');
        const btn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');

        // 显示右上角遮罩
        mask.style.display = 'block';

        // 按钮文案同步改变，增强引导效果
        btnText.innerText = '点击右上角打开';

        // 再次点击按钮重新激活遮罩
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          mask.style.display = 'block';
        });

        // 点击遮罩本身可关闭（防止用户想先看页面）
        mask.addEventListener('click', () => {
          mask.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
