<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拾语下载</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    /* 白色精致卡片 */
    .card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 36px 28px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    /* 图标发光及阴影 */
    .app-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .app-icon-wrapper::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 0;
      background: rgba(37, 99, 235, 0.15);
      filter: blur(16px);
      border-radius: 20px;
      z-index: 1;
    }

    .app-icon {
      position: relative;
      z-index: 2;
      width: 84px;
      height: 84px;
      border-radius: 20px;
      object-fit: cover;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .app-name {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .app-desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* 独立指引箭头区域（标准流排版，不重叠） */
    .arrow-guide-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .arrow-guide-text {
      font-size: 12px;
      font-weight: 600;
      color: #0284c7;
      background: #e0f2fe;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 4px;
    }

    .arrow-guide-icon {
      width: 20px;
      height: 20px;
      fill: #0284c7;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(5px);
      }
    }

    /* 主下载按钮 */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-download:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-download svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* 安心提醒与安全标识 */
    .security-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    .security-tags {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #10b981;
      font-weight: 500;
    }

    .tag-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .security-tips {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* 微信引导遮罩层（浅色适配） */
    .wx-mask {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
    }

    .wx-guide {
      position: absolute;
      top: 16px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* 跳动曲线箭头 */
    .wx-arrow {
      width: 56px;
      height: 56px;
      margin-right: 12px;
      animation: float 1.5s infinite ease-in-out;
    }

    .guide-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 20px;
      max-width: 280px;
      margin-top: 4px;
    }

    .guide-title {
      font-size: 16px;
      font-weight: 600;
      color: #0284c7;
      margin-bottom: 12px;
    }

    .guide-step {
      font-size: 14px;
      color: #334155;
      line-height: 1.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dots {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- 主卡片 -->
  <div class="card">
    <div class="app-icon-wrapper">
      <img src="https://sychat.cn/favicon.ico" alt="拾语 Logo" class="app-icon">
    </div>
    
    <h1 class="app-name">拾语</h1>
    <p class="app-desc">免费使用的视频聊天交友软件</p>

    <!-- 动态指引箭头（独立排版，绝对不遮挡） -->
    <div class="arrow-guide-box" id="webGuide">
      <span class="arrow-guide-text"> 点 击 下 载 </span>
      <svg class="arrow-guide-icon" viewBox="0 0 24 24">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
      </svg>
    </div>

    <!-- 安全下载按钮 -->
    <a href="https://oss01.sychat.cn/app/%E6%8B%BE%E8%AF%AD20260709145300_V1.0.8_1008.apk" class="btn-download" id="downloadBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      <span id="btnText">安全下载</span>
    </a>

    <!-- 安心提醒板块 -->
    <div class="security-section">
      <div class="security-tags">
        <span class="tag-item">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          官方正版
        </span>
        <span class="tag-item">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          安全无毒
        </span>
        <span class="tag-item">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          隐私安全
        </span>
      </div>
      <p class="security-tips">已通过安全软件检测，请放心安装使用</p>
    </div>
  </div>

  <!-- 微信专属提示遮罩 -->
  <div class="wx-mask" id="wxMask">
    <div class="wx-guide">
      <!-- 曲线箭头图案 -->
      <svg class="wx-arrow" viewBox="0 0 50 50" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 10 40 Q 30 20 42 8" />
        <path d="M 28 8 L 42 8 L 42 22" />
      </svg>
      
      <div class="guide-card">
        <div class="guide-title">请在浏览器中打开</div>
        <div class="guide-step">
          1. 点击右上角 <span class="badge-dots">•••</span> 按钮
        </div>
        <div class="guide-step">
          2. 选择 <strong>「在浏览器打开」</strong> 即可下载
        </div>
      </div>
    </div>
  </div>

  <script>
    function isWeChat() {
      return /micromessenger/i.test(navigator.userAgent);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const webGuide = document.getElementById('webGuide');
      const mask = document.getElementById('wxMask');
      const btn = document.getElementById('downloadBtn');
      const btnText = document.getElementById('btnText');

      if (isWeChat()) {
        // 微信环境：隐藏网页版箭头指示，显示微信右上角引导
        if (webGuide) webGuide.style.display = 'none';
        
        mask.style.display = 'block';
        btnText.innerText = '右上角浏览器打开';

        btn.addEventListener('click', (e) => {
          e.preventDefault();
          mask.style.display = 'block';
        });

        mask.addEventListener('click', () => {
          mask.style.display = 'none';
        });
      } else {
        // 普通网页/浏览器环境：显示向下跳动的指引箭头
        if (webGuide) webGuide.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
